<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TransformaUMKM — Platform Operasi Digital Terpadu untuk Bisnis &amp; UMKM Indonesia." />
  <title>Daftar — TransformaUMKM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

</head>
<body class="auth-page">

        </defs>

            <use href="#nusaCloud" fill="#7c9cf0"/>
            <use href="#nusaCloud" fill="#97b2f5" transform="translate(30 56) scale(.84)"/>
            <use href="#nusaCloud" fill="#b2c7f8" transform="translate(54 104) scale(.68)"/>
            <use href="#nusaCloud" fill="#cddbfb" transform="translate(74 144) scale(.53)"/>
            <use href="#nusaCloud" fill="#e4ecfd" transform="translate(90 176) scale(.4)"/>
          </g>
        </g>
        <g fill="none" stroke="#7c9cf0" stroke-width="2.2" stroke-linecap="round">
          <path d="M30 150 C70 120 110 118 150 80"/>
        </g>
        <g fill="#93b0f3">
          <path d="M150 80 C140 52 168 38 190 52 C176 62 164 70 150 80Z"/>
          <path d="M118 108 C100 90 112 64 138 66 C132 84 126 96 118 108Z"/>
          <path d="M84 126 C62 118 58 90 80 82 C86 98 86 112 84 126Z"/>
          <path d="M60 140 C42 138 30 118 44 102 C54 114 58 126 60 140Z"/>
        </g>
      </svg>

      <svg class="nusa-br" viewBox="0 0 440 320" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="nusaKawung" width="36" height="36" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#5b7fe0" stroke-width="1.4">
              <ellipse cx="18" cy="9" rx="4.5" ry="9"/><ellipse cx="18" cy="27" rx="4.5" ry="9"/>
              <ellipse cx="9" cy="18" rx="9" ry="4.5"/><ellipse cx="27" cy="18" rx="9" ry="4.5"/>
            </g>
            <circle cx="18" cy="18" r="1.8" fill="#5b7fe0"/>
          </pattern>
          <radialGradient id="nusaFade" cx="100%" cy="100%" r="95%">
            <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <mask id="nusaMask"><rect width="440" height="320" fill="url(#nusaFade)"/></mask>
        </defs>
        <rect width="440" height="320" fill="url(#nusaKawung)" mask="url(#nusaMask)"/>
        <g fill="#8fb0f5" opacity=".9">
          <path d="M440 190 C400 190 372 160 376 118 C410 126 436 150 440 190Z"/>
          <path d="M440 250 C392 258 348 226 344 180 C392 186 436 210 440 250Z"/>
        </g>
      </svg>
    </div>




  <main class="auth-wrap wide">
    <a href="login.html" class="auth-brand" aria-label="TransformaUMKM">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      <span class="brand-name">Transforma<span>UMKM</span></span>
    </a>

    <section class="auth-card" aria-labelledby="registerHeading">
      <h1 id="registerHeading">Buat akun usaha</h1>
      <p class="auth-sub">Gratis dan tanpa komisi. Lengkapi profil toko untuk mulai.</p>

      <form id="standaloneRegisterForm" onsubmit="handleRegisterSubmit(event)" novalidate>
        <div class="a-grid">
          <div class="a-section">Informasi usaha</div>
          <div class="a-field">
            <label for="regOwnerName" class="a-label"><span>Nama pemilik <span class="req">*</span></span></label>
            <input type="text" id="regOwnerName" class="a-input" required placeholder="Hendra Wijaya" autocomplete="name" />
          </div>
          <div class="a-field">
            <label for="regBusinessName" class="a-label"><span>Nama toko / UMKM <span class="req">*</span></span></label>
            <input type="text" id="regBusinessName" class="a-input" required placeholder="Kopi Nusantara"  />
          </div>
          <div class="a-field full">
            <label for="regCategory" class="a-label"><span>Kategori usaha <span class="req">*</span></span></label>
            <select id="regCategory" class="a-input" required>
              <option value="Kuliner & F&B">Kuliner &amp; Minuman (F&amp;B / Warung / Kafe)</option>
              <option value="Retail & Toko Kelontong">Retail, Toko Kelontong &amp; Minimarket</option>
              <option value="Fashion & Kerajinan">Fashion, Tekstil &amp; Kerajinan Lokal</option>
              <option value="Bahan Pokok & Sembako">Bahan Pokok, Sayur &amp; Sembako</option>
              <option value="Jasa & Agribisnis">Jasa Usaha &amp; Agribisnis</option>
            </select>
          </div>

          <div class="a-section" style="margin-top:.3rem">Kontak &amp; kredensial</div>
          <div class="a-field">
            <label for="regPhone" class="a-label"><span>WhatsApp usaha <span class="req">*</span></span></label>
            <input type="tel" id="regPhone" class="a-input" required placeholder="081234567890" autocomplete="tel" />
          </div>
          <div class="a-field">
            <label for="regEmail" class="a-label"><span>Email usaha <span class="req">*</span></span></label>
            <input type="email" id="regEmail" class="a-input" required placeholder="toko@nusantara.id" autocomplete="email" />
          </div>
          <div class="a-field">
            <label for="regPassword" class="a-label"><span>Kata sandi <span class="req">*</span></span></label>
            <div class="a-control">
              <input type="password" id="regPassword" class="a-input has-action" required placeholder="Min. 6 karakter" minlength="6" autocomplete="new-password" />
              <button type="button" class="a-action" onclick="togglePasswordVisibility('regPassword', this)" aria-label="Tampilkan kata sandi">
                <span class="eye-open" style="display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-closed" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg></span>
              </button>
            </div>
          </div>
          <div class="a-field">
            <label for="regConfirmPassword" class="a-label"><span>Ulangi kata sandi <span class="req">*</span></span></label>
            <div class="a-control">
              <input type="password" id="regConfirmPassword" class="a-input has-action" required placeholder="Ulangi kata sandi" minlength="6" autocomplete="new-password" />
              <button type="button" class="a-action" onclick="togglePasswordVisibility('regConfirmPassword', this)" aria-label="Tampilkan kata sandi">
                <span class="eye-open" style="display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-closed" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg></span>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" class="a-submit" id="btnRegisterSubmit" style="margin-top:.4rem"><span>Daftar &amp; buka dashboard</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      </form>

      <p class="auth-switch">Sudah punya akun?<a href="login.html">Masuk</a></p>
    </section>
    <p class="auth-foot">&copy; TransformaUMKM</p>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const STORAGE_KEY_AUTH = 'transforma_umkm_session';

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>⚡</span><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-open').style.display = show ? 'none' : 'flex';
      btn.querySelector('.eye-closed').style.display = show ? 'flex' : 'none';
      btn.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    }

    function normalizeIndonesianPhone(rawPhone) {
      if (!rawPhone || typeof rawPhone !== 'string') return null;
      let digits = rawPhone.replace(/\D/g, '');
      if (!digits) return null;
      if (digits.startsWith('62')) {
        if (digits.length < 10 || digits.length > 15) return null;
        return digits;
      }
      if (digits.startsWith('0')) {
        digits = '62' + digits.slice(1);
        if (digits.length < 10 || digits.length > 15) return null;
        return digits;
      }
      if (digits.startsWith('8')) {
        digits = '62' + digits;
        if (digits.length < 10 || digits.length > 15) return null;
        return digits;
      }
      return null;
    }

    // Catatan: Sesi autentikasi disimpan di client Storage untuk purwarupa standalone.
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const ownerName = document.getElementById('regOwnerName').value.trim();
      const businessName = document.getElementById('regBusinessName').value.trim();
      const category = document.getElementById('regCategory').value;
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (!ownerName || !businessName || !phone || !email || !password) {
        showToast('Harap lengkapi semua field yang berbintang wajib!');
        return;
      }

      if (password.length < 6) {
        showToast('Kata sandi minimal 6 karakter!');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Konfirmasi kata sandi tidak cocok!');
        return;
      }

      const normalizedPhone = normalizeIndonesianPhone(phone);
      if (!normalizedPhone) {
        showToast('Format nomor WhatsApp usaha tidak valid (gunakan format 08xx / 628xx)!');
        return;
      }

      const user = {
        name: ownerName,
        role: 'owner',
        roleLabel: 'Owner (Pemilik)',
        email: email,
        storeName: businessName,
        phone: phone,
        category: category
      };

      // Bersihkan sesi lama dari kedua storage
      try {
        localStorage.removeItem(STORAGE_KEY_AUTH);
        sessionStorage.removeItem(STORAGE_KEY_AUTH);
      } catch (err) {}

      try { sessionStorage.removeItem('transforma_wp_seen'); } catch (err) {}
      localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(user));
      showToast('Pendaftaran berhasil. Mengalihkan ke dashboard…');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    }
  </script>
  <script src="welcome.js"></script>
  <script src="dev-inspector.js"></script>
</body>
</html>
