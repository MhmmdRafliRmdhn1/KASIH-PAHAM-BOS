// ========================================================
// CUSTOM DROPDOWN — Asisten AI Tab 2 (Deskripsi Produk) & Tab 3 (Caption Promosi)
// <select> asli tetap ada (tersembunyi) sebagai sumber nilai, sehingga seluruh
// logika lama (.value, onchange, validasi form) berjalan tanpa perubahan.
// ========================================================
(function initAiCustomSelects() {
  const CHEVRON = '<svg class="cs-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  const CHECK = '<svg class="cs-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  const valueDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  const instances = [];
  let uid = 0;

  function closeAll(except) { instances.forEach(i => { if (i !== except) i.close(); }); }

  function enhance(sel) {
    if (sel.dataset.csReady) return;
    sel.dataset.csReady = '1';
    const id = 'cs' + (++uid);

    const wrap = document.createElement('div');
    wrap.className = 'cs-wrap';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    sel.classList.add('cs-native');
    sel.tabIndex = -1;
    sel.setAttribute('aria-hidden', 'true');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cs-btn';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-controls', id + '-list');
    const lbl = sel.id ? document.querySelector('label[for="' + sel.id + '"]') : null;
    if (lbl) { if (!lbl.id) lbl.id = id + '-label'; btn.setAttribute('aria-labelledby', lbl.id); }
    btn.innerHTML = '<span class="cs-label"></span>' + CHEVRON;

    const list = document.createElement('div');
    list.className = 'cs-list';
    list.id = id + '-list';
    list.setAttribute('role', 'listbox');
    list.hidden = true;

    wrap.append(btn, list);
    const labelEl = btn.querySelector('.cs-label');
    let active = -1;

    function items() { return Array.from(list.children); }

    function sync() {
      const opt = sel.options[sel.selectedIndex];
      labelEl.textContent = opt ? opt.textContent : '';
      items().forEach((el, i) => {
        const on = i === sel.selectedIndex;
        el.classList.toggle('selected', on);
        el.setAttribute('aria-selected', on ? 'true' : 'false');
      });
    }

    function build() {
      list.innerHTML = '';
      Array.from(sel.options).forEach((o, i) => {
        const el = document.createElement('div');
        el.className = 'cs-option';
        el.setAttribute('role', 'option');
        el.dataset.index = i;
        el.innerHTML = '<span class="cs-opt-text"></span>' + CHECK;
        el.firstChild.textContent = o.textContent;
        if (o.disabled) el.classList.add('disabled');
        el.addEventListener('mousedown', e => e.preventDefault());
        el.addEventListener('click', () => { if (!o.disabled) choose(i); });
        el.addEventListener('mousemove', () => setActive(i));
        list.appendChild(el);
      });
      sync();
    }

    function setActive(i) {
      active = i;
      items().forEach((el, k) => el.classList.toggle('active', k === i));
      const el = items()[i];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }

    function choose(i) {
      const changed = sel.selectedIndex !== i;
      valueDesc.set.call(sel, sel.options[i].value);
      sync();
      close();
      btn.focus();
      if (changed) sel.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function open() {
      closeAll(api);
      if (!list.hidden) return;
      list.hidden = false;
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      const r = btn.getBoundingClientRect();
      const below = window.innerHeight - r.bottom, above = r.top;
      wrap.classList.toggle('up', below < 260 && above > below);
      setActive(Math.max(0, sel.selectedIndex));
    }

    function close() {
      if (list.hidden) return;
      list.hidden = true;
      wrap.classList.remove('open', 'up');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', () => (list.hidden ? open() : close()));
    btn.addEventListener('keydown', e => {
      const n = sel.options.length;
      if (list.hidden) {
        if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); open(); }
        return;
      }
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(n - 1, active + 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, active - 1)); }
      else if (e.key === 'Home') { e.preventDefault(); setActive(0); }
      else if (e.key === 'End') { e.preventDefault(); setActive(n - 1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (active >= 0) choose(active); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Tab') { close(); }
    });

    // Fokus dari <label for> diteruskan ke tombol kustom
    sel.addEventListener('focus', () => btn.focus());
    // Nilai yang diubah lewat kode (select.value = ...) ikut menyegarkan tampilan
    Object.defineProperty(sel, 'value', {
      configurable: true,
      get() { return valueDesc.get.call(sel); },
      set(v) { valueDesc.set.call(sel, v); sync(); }
    });
    // Opsi yang diisi ulang lewat kode (mis. daftar produk toko) ikut dibangun ulang
    new MutationObserver(build).observe(sel, { childList: true, subtree: true, characterData: true });

    build();
    const api = { close };
    instances.push(api);
  }

  document.addEventListener('mousedown', e => { if (!e.target.closest('.cs-wrap')) closeAll(); });
  window.addEventListener('resize', () => closeAll());
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  document.querySelectorAll('#aiTab-product-copywriter select, #aiTab-social-caption select').forEach(enhance);
})();

</script>
<script type="text/plain" id="src-welcome">
// ========================================================
// TransformaUMKM — Alur Landing sebelum Login
//
//  Urutan (login.html): Navbar sticky + 4 section
//    Section 1  #beranda  → Hero / Welcoming page (headline, ringkasan, chip fitur, CTA)
//                           Naik sebagai "tirai" parallax menyingkap Section 2
//    Section 2  #tentang  → Potensi UMKM Indonesia (peran, tantangan, digitalisasi)
//    Section 3  #solusi   → Fitur & Solusi (Kasir POS, Manajemen Inventori, Smart Restock AI)
//    Section 4  #login    → Form Login utama menuju dasbor
//
//  Fitur:
//    - Navbar (position: fixed) tersembunyi di Section 1; class .show-nav ditambahkan
//      lewat IntersectionObserver begitu Section 1 benar-benar keluar dari layar
//      (Section 2 sepenuhnya masuk), lalu tetap tampil di Section 2–4.
//    - Navbar sticky + tombol "Langsung Login" (jalan pintas ke Section 4)
//    - Smooth scroll untuk setiap tautan [data-lp-scroll]
//    - Scroll-spy (menu aktif mengikuti section yang sedang dilihat)
//    - Parallax scroll-down Hero → Section 2: Hero terangkat utuh, Section 2 tersingkap
//      di bawahnya (pin lewat CSS sticky); lapisan Hero bergerak beda kecepatan
//    - Satu arah: begitu Hero terlewati (pengguna sudah di Section 2–4), Hero dilepas
//      dari layout (html.lp-passed) sehingga tidak bisa di-scroll balik ke Section 1.
//      Muat ulang halaman = Hero tampil lagi.
//    - Hero: partikel kanvas + parallax kursor (otomatis nonaktif bila
//      pengguna memilih "reduce motion")
//    - Animasi muncul (reveal) saat scroll, otomatis nonaktif bila
//      pengguna memilih "reduce motion"
//    - Toggle di Pengaturan (localStorage: transforma_wp_enabled) tetap
//      berfungsi: OFF → hanya Section 4 (form Login) yang ditampilkan.
//
//  File ini juga dimuat di index.html (dasbor) hanya untuk menyediakan
//  handleWpToggle() bagi halaman Pengaturan.
// ========================================================
(function () {
  'use strict';

  var LS_ENABLED = 'transforma_wp_enabled';
  var root = document.documentElement;

  // ---------- Storage helpers (aman saat storage diblokir) ----------
  function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  function isWpEnabled() {
    var v = lsGet(LS_ENABLED);
    return v === null ? true : v === 'true';
  }
  window.isWelcomingPageEnabled = isWpEnabled;

  // ---------- Pengaturan (index.html) ----------
  function syncSettingsControls() {
    var wpToggle = document.getElementById('toggleWelcomingPage');
    if (wpToggle) wpToggle.checked = isWpEnabled();
  }

  window.handleWpToggle = function (checked) {
    lsSet(LS_ENABLED, checked ? 'true' : 'false');
    if (typeof showToast === 'function') {
      showToast(checked
        ? 'Halaman sambutan diaktifkan. Alur: Hero → Potensi UMKM → Fitur → Login.'
        : 'Halaman sambutan dinonaktifkan. Langsung menuju form Login.',
        checked ? 'info' : 'warning');
    }
  };

  syncSettingsControls();

  // ========================================================
  // LANDING FLOW — hanya berjalan bila navbar landing ada (login.html)
  // ========================================================
  var nav = document.getElementById('lpNav');
  if (!nav) return;

  // Sinkronkan mode "langsung ke form" (skrip pra-render di <head> sudah
  // melakukannya; ini hanya jaring pengaman).
  root.classList.toggle('lp-skip', !isWpEnabled());
  root.classList.add('lp-ready');   // memberi tahu <head> bahwa skrip ini termuat

  function prefersReducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function setHash(id) {
    try { if (window.history && history.replaceState) history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  var hero = document.getElementById('beranda');
  var navH = function () { return nav.offsetHeight || 64; };
  var heroH = function () { return hero && hero.offsetParent !== null ? hero.offsetHeight : 0; };
  var scrollY = function () { return window.pageYOffset || root.scrollTop || 0; };

  // Tinggi Hero → CSS (--lp-hero-h) agar panggung "tirai" Section 2 selalu pas,
  // juga saat layar diputar / bilah alamat mobile naik-turun.
  function syncHeroHeight() {
    var h = heroH();
    if (h) root.style.setProperty('--lp-hero-h', h + 'px');
  }
  syncHeroHeight();
  if (hero && 'ResizeObserver' in window) new ResizeObserver(syncHeroHeight).observe(hero);
  window.addEventListener('resize', syncHeroHeight);

  // ---------- Kunci Hero: tidak bisa kembali ke Section 1 ----------
  // Saat Hero sudah sepenuhnya di luar layar (pengguna masuk Section 2–4), Hero
  // dilepas dari layout. Tata letak Section 2 disetel di CSS (html.lp-passed) agar
  // tampilannya identik, lalu posisi scroll dikurangi tinggi Hero supaya tidak ada
  // lompatan visual. Dengan begitu batas atas halaman = Section 2.
  var passed = false;

  function passHero(y, h) {
    passed = true;
    root.classList.add('lp-passed');
    window.scrollTo({ top: Math.max(0, y - h), left: 0, behavior: 'instant' });
    // Smooth scroll yang sedang berjalan ikut terhenti oleh scrollTo di atas → lanjutkan.
    if (pendingId && Date.now() < pendingUntil) {
      var id = pendingId;
      window.scrollTo({ top: landingTop(id), behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    }
  }

  // Tautan / riwayat browser ke #beranda setelah Hero dikunci → arahkan ke atas Section 2.
  window.addEventListener('hashchange', function () {
    if (passed && location.hash === '#beranda') {
      setHash('tentang');
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  });

  // ---------- Smooth scroll ----------
  // Section 2 sekarang "tertahan" (sticky) di bawah Hero, jadi scrollIntoView tidak
  // lagi menunjukkan posisi sebenarnya. Posisi tujuan dihitung manual:
  //   Beranda → 0 · Potensi UMKM → akhir angkatan Hero (= tinggi Hero)
  //   Fitur & Login → posisi dokumen section dikurangi tinggi navbar.
  function landingTop(id) {
    var target = document.getElementById(id);
    if (!target || target.offsetParent === null) return 0;   // mode "langsung ke form"
    if (id === 'beranda') return 0;
    if (id === 'tentang') return heroH();
    return Math.max(0, target.getBoundingClientRect().top + scrollY() - navH());
  }

  function setHash(id) {
    try { if (window.history && history.replaceState) history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  // Tujuan scroll yang sedang berjalan (agar bisa dilanjutkan bila Hero dilepas di tengah jalan).
  var pendingId = null, pendingUntil = 0;

  function scrollToSection(id) {
    var target = document.getElementById(id);
    if (!target) return;

    pendingId = id; pendingUntil = Date.now() + 1800;
    window.scrollTo({ top: landingTop(id), behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    setHash(id);

    // Pindahkan fokus agar pengguna keyboard / pembaca layar ikut berpindah,
    // tanpa memicu lompatan scroll tambahan.
    if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
    try { target.focus({ preventScroll: true }); } catch (e) {}
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('a[data-lp-scroll]') : null;
    if (!link) return;
    // Biarkan Ctrl/Cmd/Shift + klik (buka tab baru) berjalan normal.
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

    var id = (link.getAttribute('href') || '').replace(/^#/, '');
    if (!id) return;

    e.preventDefault();
    scrollToSection(id);
  });

  // Dibuka dengan #tentang (mis. dari tautan luar): browser tidak bisa menghitungnya
  // sendiri karena Section 2 sticky, jadi arahkan manual.
  if (location.hash === '#tentang') window.scrollTo(0, landingTop('tentang'));

  // ---------- Scroll-spy: tandai menu aktif ----------
  // Berbasis posisi scroll (bukan IntersectionObserver) karena Section 2 sudah
  // "ada" di layar di balik Hero sebelum Hero terangkat.
  var menuLinks = Array.prototype.slice.call(nav.querySelectorAll('[data-lp-link]'));
  var spyIds = ['beranda', 'tentang', 'solusi', 'login'];
  var currentActive = null;

  function setActive(id) {
    if (id === currentActive) return;
    currentActive = id;
    menuLinks.forEach(function (link) {
      if (link.getAttribute('data-lp-link') === id) link.setAttribute('aria-current', 'true');
      else link.removeAttribute('aria-current');
    });
  }

  function updateSpy(y) {
    var vh = window.innerHeight;
    var line = y + vh * 0.45;           // garis pantau sedikit di atas tengah layar
    var id = 'beranda';
    spyIds.forEach(function (key) {
      if (key !== 'beranda' && line >= landingTop(key)) id = key;
    });
    // Mentok di dasar halaman → section terakhir (Login) aktif.
    if (y + vh >= (root.scrollHeight || 0) - 2 && hero && hero.offsetParent !== null) id = 'login';
    setActive(id);
  }

  // ---------- Navbar: muncul hanya setelah Section 1 benar-benar lewat ----------
  // Hero diamati: selama masih ada bagian Hero di layar → navbar disembunyikan. Begitu Hero
  // keluar sepenuhnya (atau dilepas dari layout oleh kunci Hero / mode langsung-login) →
  // .show-nav ditambahkan. Scroll balik ke Hero (bila masih memungkinkan) → disembunyikan lagi.
  if (hero && hero.offsetParent !== null && 'IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      var heroInView = entries[entries.length - 1].isIntersecting;
      nav.classList.toggle('show-nav', !heroInView);
    }, { threshold: 0 }).observe(hero);
  } else {
    nav.classList.add('show-nav');   // tanpa Hero / tanpa IntersectionObserver: navbar selalu tampil
  }

  // ---------- Parallax Hero (lapisan bergerak beda kecepatan) ----------
  // Lembar Hero sendiri naik 1:1 mengikuti scroll (native, tanpa fade). Di dalamnya,
  // tiap lapisan diberi pergeseran searah turun sehingga tampak naik lebih lambat:
  // latar 0,55 · konten 0,22 · orb 0,30 / 0,42 / 0,54 (nilai yang sama dengan zip).
  var bg = document.getElementById('wpBg');
  var content = document.getElementById('wpContent');
  var orbs = hero ? Array.prototype.slice.call(hero.querySelectorAll('.wp-orb')) : [];
  var cue = hero ? hero.querySelector('.wp-scroll-cue') : null;
  var mx = 0, my = 0;                   // posisi kursor (-1..1), diisi di bawah
  var motionOK = !prefersReducedMotion();

  function renderHero(y) {
    if (!hero || !motionOK) return;
    var h = heroH();
    if (!h) return;
    var p = Math.max(0, Math.min(1, y / h));
    if (bg) bg.style.transform = 'translate3d(' + (-mx * 18) + 'px,' + (p * h * 0.55 - my * 14) + 'px,0)';
    if (content) content.style.transform = 'translate3d(' + (mx * 8) + 'px,' + (p * h * 0.22 + my * 6) + 'px,0)';
    // Penanda scroll ikut lapisan konten (0,22) agar tidak bertumpuk dengan tombol CTA.
    if (cue) cue.style.translate = '0 ' + (p * h * 0.22) + 'px';
    orbs.forEach(function (orb, i) {
      // properti "translate" terpisah dari "transform", jadi tidak menimpa animasi melayang orb.
      orb.style.translate = '0 ' + (p * h * (0.3 + i * 0.12)) + 'px';
    });
  }

  // ---------- Satu loop scroll untuk navbar, spy, dan parallax ----------
  var ticking = false;
  function frame() {
    var y = scrollY();
    if (!passed && hero && hero.offsetParent !== null) {
      var h = heroH();
      if (h && y >= h - 1) { passHero(y, h); y = scrollY(); }
    }
    updateSpy(y);
    renderHero(y);
    ticking = false;
  }
  function queueFrame() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(frame);
  }
  window.addEventListener('scroll', queueFrame, { passive: true });
  window.addEventListener('resize', queueFrame);
  frame();

  // ---------- Reveal saat scroll ----------
  // Kelas "lp-anim" dipasang oleh skrip di <head> hanya bila animasi boleh jalan
  // (IntersectionObserver tersedia & bukan reduce-motion).
  var revealItems = Array.prototype.slice.call(document.querySelectorAll('.lp-reveal'));

  if (root.classList.contains('lp-anim') && 'IntersectionObserver' in window) {
    var reveal = new IntersectionObserver(function (entries, observer) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-in');
        observer.unobserve(entry.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    revealItems.forEach(function (item) { reveal.observe(item); });
  } else {
    revealItems.forEach(function (item) { item.classList.add('is-in'); });
  }

  // ---------- Hero: partikel + parallax kursor ----------
  // Murni dekoratif. Dilewati bila pengguna memilih "reduce motion"; animasi
  // dijeda otomatis saat hero tidak terlihat agar hemat CPU/baterai.
  var canvas = document.getElementById('wpParticlesCanvas');

  if (hero && canvas && canvas.getContext && motionOK) {
    var ctx = canvas.getContext('2d');
    var particles = [];
    var heroVisible = true;
    var particleRaf = null;

    function sizeCanvas() {
      canvas.width = hero.clientWidth;
      canvas.height = hero.clientHeight;
    }
    function seedParticles() {
      particles = [];
      for (var i = 0; i < 56; i++) {
        particles.push({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height,
          r: Math.random() * 1.3 + 0.25, a: Math.random() * 0.45 + 0.12,
          dx: (Math.random() - 0.5) * 0.2, dy: (Math.random() - 0.5) * 0.14,
          da: (Math.random() - 0.5) * 0.0035
        });
      }
    }
    function drawParticles() {
      particleRaf = null;
      if (!heroVisible) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function (p) {
        p.x += p.dx; p.y += p.dy; p.a += p.da;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        if (p.a < 0.05 || p.a > 0.6) p.da *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(148,163,184,' + p.a + ')'; ctx.fill();
      });
      particleRaf = window.requestAnimationFrame(drawParticles);
    }
    function startParticles() { if (!particleRaf && heroVisible && hero.offsetParent !== null) particleRaf = window.requestAnimationFrame(drawParticles); }

    sizeCanvas(); seedParticles(); startParticles();
    window.addEventListener('resize', function () { sizeCanvas(); seedParticles(); startParticles(); });

    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        heroVisible = entries[0].isIntersecting;
        if (heroVisible) startParticles();
      }).observe(hero);
    }

    // Parallax kursor (perangkat dengan mouse), digabung dengan parallax scroll di renderHero().
    hero.addEventListener('mousemove', function (e) {
      var r = hero.getBoundingClientRect();
      mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      my = ((e.clientY - r.top) / r.height - 0.5) * 2;
      queueFrame();
    });
    hero.addEventListener('mouseleave', function () { mx = my = 0; queueFrame(); });
  }
})();

</script>
<script type="text/plain" id="src-dev">
/**
 * TransformaUMKM Dev Inspector & Insights Overlay
 * Mirrored after Next.js / Turbopack Dev Overlay & Insights Inspector
 */
(function () {
  'use strict';

  // Issue storage
  const issues = [];
  let currentIndex = 0;
  let isOpen = false;
  let isMinimized = false;

  // Injected CSS for the overlay
  const css = `
    .dev-inspector-pill {
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 999999;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: #18181b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }
    .dev-inspector-pill:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2);
    }
    .dev-inspector-pill.has-issues {
      background: #ea580c;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }
    .dev-inspector-pill.has-issues:hover {
      background: #c2410c;
      box-shadow: 0 6px 22px rgba(234, 88, 12, 0.6);
    }
    .dev-dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }
    .dev-inspector-pill.has-issues .dev-dot-pulse {
      background: #ffffff;
      animation: devPulse 1.8s infinite;
    }
    @keyframes devPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .dev-pill-close {
      margin-left: 2px;
      opacity: 0.7;
      font-size: 13px;
      line-height: 1;
    }
    .dev-pill-close:hover {
      opacity: 1;
    }

    /* Modal Backdrop */
    .dev-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    }
    .dev-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal Box */
    .dev-modal-box {
      width: 100%;
      max-width: 620px;
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 14px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      color: #f4f4f5;
      overflow: hidden;
      transform: scale(0.97) translateY(10px);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dev-modal-backdrop.active .dev-modal-box {
      transform: scale(1) translateY(0);
    }

    /* Modal Topbar */
    .dev-modal-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
      font-size: 12px;
      color: #a1a1aa;
    }
    .dev-nav-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dev-nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #d4d4d8;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      padding: 0;
      transition: all 0.15s ease;
    }
    .dev-nav-btn:hover:not(:disabled) {
      background: #27272a;
      color: #ffffff;
    }
    .dev-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .dev-counter {
      font-weight: 600;
      color: #fafafa;
    }
    .dev-top-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .dev-top-tag span.badge-circle {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ea580c;
    }

    /* Modal Body */
    .dev-modal-body {
      padding: 22px 24px;
    }
    .dev-insight-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(234, 88, 12, 0.15);
      color: #fb923c;
      border: 1px solid rgba(234, 88, 12, 0.35);
      margin-bottom: 14px;
    }
    .dev-insight-badge.err {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.35);
    }
    .dev-insight-badge.warn {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }
    .dev-insight-badge.sec {
      background: rgba(234, 88, 12, 0.18);
      color: #f97316;
      border-color: rgba(234, 88, 12, 0.4);
    }
    .dev-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 10px 0;
      line-height: 1.35;
    }
    .dev-modal-desc {
      font-size: 13.5px;
      color: #a1a1aa;
      line-height: 1.6;
      margin: 0 0 18px 0;
    }

    /* Agent Prompt Card */
    .dev-prompt-card {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .dev-prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .dev-prompt-label {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .dev-copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dev-copy-btn:hover {
      background: #27272a;
      border-color: #52525b;
      color: #ffffff;
    }
    .dev-copy-btn.copied {
      background: #065f46;
      border-color: #059669;
      color: #34d399;
    }
    .dev-prompt-code {
      font-family: "JetBrains Mono", Menlo, Consolas, Monaco, monospace;
      font-size: 12.5px;
      color: #e4e4e7;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }

    /* Modal Footer */
    .dev-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #71717a;
      padding-top: 10px;
      border-top: 1px solid #27272a;
    }
    .dev-modal-footer button {
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 8px;
    }
    .dev-modal-footer button:hover {
      color: #ffffff;
    }
  `;

  // Inject styles
  const styleEl = document.createElement('style');
  styleEl.textContent = css;
  document.head.appendChild(styleEl);

  // Create Pill element
  const pill = document.createElement('div');
  pill.className = 'dev-inspector-pill';
  pill.id = 'devInspectorPill';
  pill.innerHTML = `
    <span class="dev-dot-pulse"></span>
    <span id="devPillLabel">0 Issues</span>
  `;
  document.body.appendChild(pill);

  // Create Modal Backdrop & Box
  const modal = document.createElement('div');
  modal.className = 'dev-modal-backdrop';
  modal.id = 'devInspectorModal';
  modal.innerHTML = `
    <div class="dev-modal-box" onclick="event.stopPropagation()">
      <div class="dev-modal-topbar">
        <div class="dev-nav-group">
          <button type="button" class="dev-nav-btn" id="devPrevBtn" title="Previous issue">&lsaquo;</button>
          <span class="dev-counter" id="devIssueCounter">Insights 1/1</span>
          <button type="button" class="dev-nav-btn" id="devNextBtn" title="Next issue">&rsaquo;</button>
        </div>
        <div class="dev-top-tag">
          <span class="badge-circle"></span>
          <span>TransformaUMKM Dev Inspector</span>
          <button type="button" class="dev-nav-btn" id="devCloseModal" style="margin-left: 6px;" title="Tutup">&times;</button>
        </div>
      </div>
      <div class="dev-modal-body">
        <span class="dev-insight-badge sec" id="devTag">Security Insight</span>
        <h3 class="dev-modal-title" id="devTitle">Issue Title</h3>
        <p class="dev-modal-desc" id="devDesc">Issue Description</p>

        <div class="dev-prompt-card">
          <div class="dev-prompt-header">
            <span class="dev-prompt-label">Agent prompt</span>
            <button type="button" class="dev-copy-btn" id="devCopyBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span>Copy prompt</span>
            </button>
          </div>
          <pre class="dev-prompt-code" id="devPromptCode">Run instruction here</pre>
        </div>

        <div class="dev-modal-footer">
          <span id="devInstructionSub">Ask your coding agent to fix this issue.</span>
          <div>
            <button type="button" id="devDismissBtn">Tandai Selesai</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  // Helper to add issues
  window.addDevIssue = function (issue) {
    issues.push({
      category: issue.category || 'Security Insight',
      badgeClass: issue.badgeClass || 'sec',
      title: issue.title || 'Pemberitahuan Sistem',
      description: issue.description || 'Tidak ada detail tambahan.',
      agentPrompt: issue.agentPrompt || 'Periksa status aplikasi dan perbaiki masalah yang dilaporkan.',
      instruction: issue.instruction || 'Salin prompt ini ke asisten coding Anda.'
    });
    updateUI();
  };

  function updateUI() {
    const pillLabel = document.getElementById('devPillLabel');
    if (issues.length === 0) {
      pill.className = 'dev-inspector-pill';
      pillLabel.textContent = 'No issues';
      if (isOpen) closeModal();
      return;
    }

    pill.className = 'dev-inspector-pill has-issues';
    pillLabel.innerHTML = `${issues.length} ${issues.length === 1 ? 'Insight' : 'Insights'} &nbsp;<span class="dev-pill-close">&times;</span>`;

    if (currentIndex >= issues.length) currentIndex = issues.length - 1;
    if (currentIndex < 0) currentIndex = 0;

    const current = issues[currentIndex];
    if (!current) return;

    document.getElementById('devIssueCounter').textContent = `Insights ${currentIndex + 1}/${issues.length}`;
    document.getElementById('devPrevBtn').disabled = currentIndex === 0;
    document.getElementById('devNextBtn').disabled = currentIndex === issues.length - 1;

    const tag = document.getElementById('devTag');
    tag.textContent = current.category;
    tag.className = `dev-insight-badge ${current.badgeClass || 'sec'}`;

    document.getElementById('devTitle').textContent = current.title;
    document.getElementById('devDesc').textContent = current.description;
    document.getElementById('devPromptCode').textContent = current.agentPrompt;
    document.getElementById('devInstructionSub').textContent = current.instruction;
  }

  function openModal() {
    if (issues.length === 0) return;
    isOpen = true;
    modal.classList.add('active');
    updateUI();
  }

  function closeModal() {
    isOpen = false;
    modal.classList.remove('active');
  }

  // Event handlers
  pill.addEventListener('click', (e) => {
    if (e.target.closest('.dev-pill-close')) {
      pill.style.display = 'none';
      return;
    }
    if (issues.length > 0) openModal();
  });

  modal.addEventListener('click', closeModal);
  document.getElementById('devCloseModal').addEventListener('click', closeModal);

  document.getElementById('devPrevBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentIndex > 0) {
      currentIndex--;
      updateUI();
    }
  });

  document.getElementById('devNextBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentIndex < issues.length - 1) {
      currentIndex++;
      updateUI();
    }
  });

  document.getElementById('devDismissBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    issues.splice(currentIndex, 1);
    if (issues.length === 0) {
      closeModal();
    } else {
      if (currentIndex >= issues.length) currentIndex = issues.length - 1;
      updateUI();
    }
  });

  document.getElementById('devCopyBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const text = document.getElementById('devPromptCode').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('devCopyBtn');
      btn.classList.add('copied');
      btn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span>Copied!</span>
      `;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span>Copy prompt</span>
        `;
      }, 2000);
    });
  });

  // Automatically monitor and capture runtime errors
  window.addEventListener('error', function (event) {
    window.addDevIssue({
      category: 'Runtime Error',
      badgeClass: 'err',
      title: event.message || 'Unhandled JavaScript Error',
      description: `Terjadi error pada file ${event.filename || 'unknown'} di baris ${event.lineno || '?'}:${event.colno || '?'}.`,
      agentPrompt: `Fix JavaScript runtime error: "${event.message}" at ${event.filename}:${event.lineno}`,
      instruction: 'Ask your coding agent to fix this script error.'
    });
  });

  window.addEventListener('unhandledrejection', function (event) {
    window.addDevIssue({
      category: 'Promise Rejection',
      badgeClass: 'err',
      title: 'Unhandled Promise Rejection',
      description: String(event.reason || 'Promise rejected without catch handler.'),
      agentPrompt: `Handle unhandled Promise rejection: ${String(event.reason)}`,
      instruction: 'Ask your coding agent to inspect asynchronous calls.'
    });
  });

  // Built-in starter security & configuration audits
  document.addEventListener('DOMContentLoaded', () => {
    // Audit 1: Session Security & Token Expiry Check
    const hasSecureSession = typeof SessionSecurity !== 'undefined';
    if (!hasSecureSession) {
      window.addDevIssue({
        category: 'Security Insight',
        badgeClass: 'sec',
        title: 'Tingkatkan keamanan penyimpanan sesi (Session Storage).',
        description: 'Saat ini sesi login UMKM disimpan tanpa enkripsi di localStorage. Disarankan menggunakan enkripsi token dan auto-expiry.',
        agentPrompt: 'Audit modul otentikasi di script.js dan implementasikan enkripsi session atau token expiry otomatis.',
        instruction: "Ask your coding agent to upgrade: Run 'next upgrade --agent=security' and follow its instructions."
      });
    }

    // Audit 2: Network / Favicon Asset Check
    if (!document.querySelector('link[rel*="icon"]')) {
      window.addDevIssue({
        category: 'Asset Insight',
        badgeClass: 'warn',
        title: 'Tambahkan icon favicon pada halaman web',
        description: 'Browser meminta favicon secara berkala. Menambahkan favicon SVG atau ICO akan mengeliminasi request 404 dari terminal live server.',
        agentPrompt: 'Tambahkan link favicon SVG inline di <head> index.html untuk menghilangkan request 404 /favicon.ico.',
        instruction: 'Ask your coding agent to configure the website favicon.'
      });
    }

    updateUI();
  });

})();

</script>

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var q = new URLSearchParams(location.search).get('view');
  var view = (q === 'login' || q === 'register' || q === 'app') ? q : null;
  if (!view) {
    var has = false;
    try { has = typeof SessionSecurity !== 'undefined' && !!SessionSecurity.getSession(); } catch (e) {}
    view = has ? 'app' : 'login';
  }
  var cfg = {
    login:    { title: 'TransformaUMKM — Digitalisasi UMKM Indonesia · Masuk', htmlClass: 'landing', bodyClass: 'auth-page lp-body', tpl: 'tpl-login',    pre: 'src-login-pre', bodyScript: null,             scripts: ['src-login-inline', 'src-welcome', 'src-dev'] },
    register: { title: 'Daftar — TransformaUMKM',                               htmlClass: '',        bodyClass: 'auth-page',         tpl: 'tpl-register', pre: null,            bodyScript: null,             scripts: ['src-register-inline', 'src-welcome', 'src-dev'] },
    app:      { title: 'Dashboard — TransformaUMKM',                            htmlClass: '',        bodyClass: '',                  tpl: 'tpl-app',      pre: 'src-app-pre',   bodyScript: 'src-app-body',   scripts: ['src-script', 'src-welcome', 'src-dev'] }
  }[view];

  function run(id) {
    var src = document.getElementById(id);
    if (!src) return;
    var s = document.createElement('script');
    s.text = src.textContent;
    document.body.appendChild(s);
  }

  document.title = cfg.title;
  if (cfg.htmlClass) root.classList.add(cfg.htmlClass);
  if (cfg.pre) { var p = document.createElement('script'); p.text = document.getElementById(cfg.pre).textContent; document.head.appendChild(p); }
  if (cfg.bodyClass) document.body.className = cfg.bodyClass;
  document.body.insertAdjacentHTML('beforeend', document.getElementById(cfg.tpl).innerHTML);
  if (cfg.bodyScript) run(cfg.bodyScript);
  cfg.scripts.forEach(run);
})();
</script>
</body>
