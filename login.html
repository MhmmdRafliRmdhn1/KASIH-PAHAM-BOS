<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TransformaUMKM — Platform Operasi Digital Terpadu untuk Bisnis &amp; UMKM Indonesia." />
  <title>Masuk — TransformaUMKM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="alternate icon" href="favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
    <div class="nusa-deco" aria-hidden="true">
      <svg class="nusa-tr" viewBox="0 0 560 400" preserveAspectRatio="xMaxYMin meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="nusaCloud" d="M0 260 C0 205 48 180 84 204 C96 150 170 132 206 178 C240 146 316 166 308 232 C352 228 392 262 368 304 L0 304 Z"/>
        </defs>
        <g transform="translate(150 -118)">
          <g transform="translate(0 0) scale(1.05)">
            <use href="#nusaCloud" fill="#7c9cf0"/>
            <use href="#nusaCloud" fill="#97b2f5" transform="translate(30 56) scale(.84)"/>
            <use href="#nusaCloud" fill="#b2c7f8" transform="translate(54 104) scale(.68)"/>
            <use href="#nusaCloud" fill="#cddbfb" transform="translate(74 144) scale(.53)"/>
            <use href="#nusaCloud" fill="#e4ecfd" transform="translate(90 176) scale(.4)"/>
          </g>
        </g>
        <g fill="none" stroke="#7c9cf0" stroke-width="2.2" stroke-linecap="round">
          <path d="M30 150 C70 120 110 118 150 80"/>
        </g>
        <g fill="#93b0f3">
          <path d="M150 80 C140 52 168 38 190 52 C176 62 164 70 150 80Z"/>
          <path d="M118 108 C100 90 112 64 138 66 C132 84 126 96 118 108Z"/>
          <path d="M84 126 C62 118 58 90 80 82 C86 98 86 112 84 126Z"/>
          <path d="M60 140 C42 138 30 118 44 102 C54 114 58 126 60 140Z"/>
        </g>
      </svg>

      <svg class="nusa-br" viewBox="0 0 440 320" preserveAspectRatio="xMaxYMax meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="nusaKawung" width="36" height="36" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#5b7fe0" stroke-width="1.4">
              <ellipse cx="18" cy="9" rx="4.5" ry="9"/><ellipse cx="18" cy="27" rx="4.5" ry="9"/>
              <ellipse cx="9" cy="18" rx="9" ry="4.5"/><ellipse cx="27" cy="18" rx="9" ry="4.5"/>
            </g>
            <circle cx="18" cy="18" r="1.8" fill="#5b7fe0"/>
          </pattern>
          <radialGradient id="nusaFade" cx="100%" cy="100%" r="95%">
            <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <mask id="nusaMask"><rect width="440" height="320" fill="url(#nusaFade)"/></mask>
        </defs>
        <rect width="440" height="320" fill="url(#nusaKawung)" mask="url(#nusaMask)"/>
        <g fill="#8fb0f5" opacity=".9">
          <path d="M440 190 C400 190 372 160 376 118 C410 126 436 150 440 190Z"/>
          <path d="M440 250 C392 258 348 226 344 180 C392 186 436 210 440 250Z"/>
        </g>
      </svg>
    </div>




  <main class="auth-wrap">
    <a href="login.html" class="auth-brand" aria-label="TransformaUMKM">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></span>
      <span class="brand-name">Transforma<span>UMKM</span></span>
    </a>

    <section class="auth-card" aria-labelledby="loginHeading">
      <h1 id="loginHeading">Selamat datang kembali</h1>
      <p class="auth-sub">Masuk ke akun usaha Anda untuk membuka dashboard.</p>

      <div class="demo-row">
        <span>Akun demo:</span>
        <button type="button" class="demo-pill" onclick="quickFillLogin('owner')">Pemilik</button>
        <button type="button" class="demo-pill" onclick="quickFillLogin('cashier')">Kasir</button>
      </div>

      <form id="standaloneLoginForm" onsubmit="handleLoginSubmit(event)" novalidate>
        <div class="a-field">
          <label for="loginEmail" class="a-label"><span>Email atau nama pengguna</span></label>
          <div class="a-control">
            <span class="a-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg></span>
            <input type="text" id="loginEmail" class="a-input has-icon" required placeholder="owner@nusantara.id" value="owner@nusantara.id" autocomplete="username" />
          </div>
        </div>

        <div class="a-field">
          <div class="a-label">
            <label for="loginPassword">Kata sandi</label>
            <a href="javascript:void(0)" onclick="showToast('Petunjuk demo: kata sandi default adalah demo1234')">Lupa sandi?</a>
          </div>
          <div class="a-control">
            <span class="a-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
            <input type="password" id="loginPassword" class="a-input has-icon has-action" required placeholder="••••••••" value="demo1234" autocomplete="current-password" />
            <button type="button" class="a-action" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Tampilkan kata sandi">
              <span class="eye-open" style="display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="eye-closed" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg></span>
            </button>
          </div>
        </div>

        <label class="a-check"><input type="checkbox" id="loginRemember" checked /><span>Ingat saya di perangkat ini</span></label>

        <button type="submit" class="a-submit" id="btnLoginSubmit"><span>Masuk</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      </form>

      <p class="auth-switch">Belum punya akun?<a href="register.html">Daftar gratis</a></p>
    </section>
    <p class="auth-foot">&copy; TransformaUMKM</p>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const STORAGE_KEY_AUTH = 'transforma_umkm_session';

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>⚡</span><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-open').style.display = show ? 'none' : 'flex';
      btn.querySelector('.eye-closed').style.display = show ? 'flex' : 'none';
      btn.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
    }

    function quickFillLogin(role) {
      const owner = role === 'owner';
      document.getElementById('loginEmail').value = owner ? 'owner@nusantara.id' : 'kasir@nusantara.id';
      document.getElementById('loginPassword').value = 'demo1234';
      showToast(owner ? 'Kredensial Pemilik terisi otomatis.' : 'Kredensial Kasir terisi otomatis.');
    }

    // Catatan: sesi disimpan di client Storage (purwarupa offline-first).
    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const remember = document.getElementById('loginRemember').checked;
      if (!email) { showToast('Silakan masukkan email atau nama pengguna.'); return; }

      const user = email.toLowerCase().includes('kasir')
        ? { name: 'Siti Rahma', role: 'cashier', roleLabel: 'Kasir Toko', email: email, storeName: 'Kopi & Ritel Nusantara', phone: '081298765432', category: 'Retail' }
        : { name: 'Hendra Wijaya', role: 'owner', roleLabel: 'Owner (Pemilik)', email: email || 'owner@nusantara.id', storeName: 'Kopi & Ritel Nusantara', phone: '081234567890', category: 'Kuliner & F&B' };

      if (typeof SessionSecurity !== 'undefined') {
        SessionSecurity.saveSession(user, remember);
      } else {
        try { localStorage.removeItem(STORAGE_KEY_AUTH); sessionStorage.removeItem(STORAGE_KEY_AUTH); } catch (err) {}
        try { sessionStorage.removeItem('transforma_wp_seen'); } catch (err) {}
        if (remember) localStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(user));
        else sessionStorage.setItem(STORAGE_KEY_AUTH, JSON.stringify(user));
      }

      showToast('Berhasil masuk. Mengalihkan ke dashboard…');
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
    }
  </script>
  <script src="auth-security.js"></script>
  <script src="welcome.js"></script>
  <script src="dev-inspector.js"></script>
</body>
</html>
